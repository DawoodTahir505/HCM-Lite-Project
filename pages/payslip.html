<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payslip · HCM Lite</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("hcm_theme") || "light";</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <h1>Payslip</h1>
        <p class="sub">Monthly salary slip. Use Print and choose “Save as PDF”.</p>
      </div>

      <div class="card no-print">
        <div class="toolbar">
          <div id="slip-user-field"><select id="slip-user" aria-label="Employee"></select></div>
          <input id="slip-month" type="month" aria-label="Month">
          <span class="grow"></span>
          <button class="btn btn-primary" id="print-btn" onclick="window.print()"><span data-icon="printer" data-size="16"></span> Print / Save as PDF</button>
        </div>
      </div>
      <div id="slip-area"></div>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/attendance.js"></script>
  <script src="../js/payslip.js"></script>
  <script>
    const currentUser = requireRole(["admin", "employee"]);
    if (currentUser) {
      renderShell("payslip");
      initPayslip();
    }
  </script>
</body>
</html>
