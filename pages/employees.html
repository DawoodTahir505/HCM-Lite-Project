<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees · HCM Lite</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("hcm_theme") || "light";</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <h1>Employees</h1>
        <p class="sub">Add, edit and remove employees. Adding an employee also creates their login.</p>
      </div>

      <div class="grid grid-3">
        <div class="card stat"><div class="stat-icon teal" data-icon="users"></div><div><div class="stat-value" id="es-total">0</div><div class="stat-label">Employees</div></div></div>
        <div class="card stat"><div class="stat-icon purple" data-icon="building"></div><div><div class="stat-value" id="es-depts">0</div><div class="stat-label">Departments</div></div></div>
        <div class="card stat"><div class="stat-icon green" data-icon="dollar"></div><div><div class="stat-value text" id="es-payroll">0</div><div class="stat-label">Monthly payroll</div></div></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input id="search" class="grow" placeholder="Search by name or email" aria-label="Search employees">
          <select id="filter-dept" aria-label="Filter by department"></select>
          <button class="btn btn-primary" onclick="openEmployeeForm()"><span data-icon="plus" data-size="16"></span> Add employee</button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Employee</th><th>Department</th><th>Salary</th><th>Joined</th><th>Face</th><th>Actions</th></tr></thead>
            <tbody id="emp-body"></tbody>
          </table>
        </div>
      </div>

      <dialog id="emp-dialog">
        <div class="modal">
          <div class="modal-head"><h2 id="emp-title">Add employee</h2><button class="icon-btn" type="button" onclick="closeDialog(empDialog)" aria-label="Close">✕</button></div>
          <form id="emp-form" novalidate>
            <input type="hidden" id="empId">
            <div class="form-row">
              <div class="field"><label for="name">Full name</label><input id="name" type="text" ><div class="error" id="name-error"></div></div>
              <div class="field"><label for="email">Email (used to log in)</label><input id="email" type="email" ><div class="error" id="email-error"></div></div>
            </div>
            <div class="form-row">
              <div class="field"><label for="password">Password</label><input id="password" type="password" ><div class="error" id="password-error"></div></div>
              <div class="field"><label for="department">Department</label><input id="department" list="dept-list"><datalist id="dept-list"></datalist><div class="error" id="department-error"></div></div>
            </div>
            <div class="form-row">
              <div class="field"><label for="salary">Monthly salary (Rs.)</label><input id="salary" type="number" min="1"><div class="error" id="salary-error"></div></div>
              <div class="field"><label for="joinDate">Joining date</label><input id="joinDate" type="date" ><div class="error" id="joinDate-error"></div></div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-outline" type="button" onclick="closeDialog(empDialog)">Cancel</button>
              <button class="btn btn-primary" type="submit">Save</button>
            </div>
          </form>
        </div>
      </dialog>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/employees.js"></script>
  <script>
    const currentUser = requireRole("admin");
    if (currentUser) {
      renderShell("employees");
      initEmployees();
    }
  </script>
</body>
</html>
