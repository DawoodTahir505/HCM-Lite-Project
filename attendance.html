<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance · HCM Lite</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("hcm_theme") || "light";</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <h1>Attendance</h1>
        <p class="sub">Every employee's attendance for any date.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <input id="att-date" type="date" aria-label="Date" onchange="renderAdminAttendance()">
          <select id="att-dept" aria-label="Department" onchange="renderAdminAttendance()"></select>
          <span class="grow"></span>
          <button class="btn btn-outline" onclick="exportAttendanceCSV()"><span data-icon="download" data-size="16"></span> Export month (CSV)</button>
        </div>
        <div id="att-summary" class="row" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Employee</th><th>Department</th><th>Check in</th><th>Check out</th><th>Hours</th><th>Status</th></tr></thead>
            <tbody id="att-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/attendance.js"></script>
  <script>
    const currentUser = requireRole("admin");
    if (currentUser) {
      renderShell("attendance");
      document.getElementById("att-date").value = todayStr(); fillDepartmentSelect("att-dept"); renderAdminAttendance();
    }
  </script>
</body>
</html>
