<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Requests · HCM Lite</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("hcm_theme") || "light";</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <h1>Leave Requests</h1>
        <p class="sub">Approve or reject leave with a comment.</p>
      </div>

      <div class="card">
        <div class="toolbar">
          <select id="leave-filter" aria-label="Filter by status" onchange="renderLeaveRequests()">
            <option value="">All requests</option>
            <option value="pending" selected>Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th>Action / comment</th></tr></thead>
            <tbody id="leaves-body"></tbody>
          </table>
        </div>
      </div>

      <dialog id="decision-dialog">
        <div class="modal">
          <div class="modal-head"><h2 id="decision-title">Leave</h2><button class="icon-btn" type="button" onclick="closeDialog(document.getElementById('decision-dialog'))" aria-label="Close">✕</button></div>
          <p class="muted" id="decision-summary" style="margin-bottom:14px"></p>
          <form id="decision-form" novalidate onsubmit="confirmDecision(event)">
            <div class="field"><label for="decision-comment">Comment</label><textarea id="decision-comment" rows="3" placeholder="Required when rejecting"></textarea><div class="error" id="decision-comment-error"></div></div>
            <div class="modal-foot">
              <button class="btn btn-outline" type="button" onclick="closeDialog(document.getElementById('decision-dialog'))">Cancel</button>
              <button class="btn btn-primary" type="submit" id="decision-confirm">Confirm</button>
            </div>
          </form>
        </div>
      </dialog>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/leave.js"></script>
  <script>
    const currentUser = requireRole("admin");
    if (currentUser) {
      renderShell("leaves");
      renderLeaveRequests();
    }
  </script>
</body>
</html>
